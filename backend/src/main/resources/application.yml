spring:
  application:
    name: checkin
  web:
    error:
      # Spring Boot 4 使用 spring.web.error；禁止返回异常消息、绑定值和堆栈。
      include-message: never
      include-binding-errors: never
      include-stacktrace: never
      include-exception: false
  jackson:
    deserialization:
      # 严格拒绝 DTO 未声明的字段（例如客户端伪造的 userId）和多余 JSON 内容。
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

app:
  session:
    ttl-seconds: ${SESSION_TTL_SECONDS:7200}
  # today / streak 业务缓存默认 30 秒，通过短 TTL 收敛极端并发旧值。
  cache:
    ttl-seconds: ${APP_CACHE_TTL_SECONDS:30}
  # 已实现的打卡、今日状态及连续天数统一使用该业务时区。
  business-zone: ${APP_BUSINESS_ZONE:Asia/Shanghai}
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8080}

